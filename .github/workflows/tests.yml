# The tests of this repository on GitHub's runners (patch tool plan decision 15, "GitHub 上的测试").
# Every job runs a harness that exists anyway: lint, actionlint over the workflows; unit, pytest
# (Linux at the tool's declared floors, macOS at the latest) and tools/tests/run-all.sh;
# toy-channel, tools/tests/toy-channel.sh with the release's own rattler-build, two release lines in
# one channel (Isabelle2025-2, and Isabelle2026, whose only isabelle build, 0, is pristine); hooks,
# the hook-layer test with real conda; accept and accept-2026, tools/accept on that channel for each
# line on the five legs, through accept.yml, the release's own accept job.
name: tests

on:
  push:
    branches: [main]
    paths-ignore: ["ai-artifacts/**"]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"          # weekly: a retired runner or a new conda shows within a week

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "actionlint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: "actionlint over every workflow"
        run: |
          set -euo pipefail
          d=$RUNNER_TEMP/actionlint; mkdir -p "$d"
          curl -fsSL -o "$d/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $d/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$d/actionlint.tar.gz" -C "$d" actionlint
          "$d/actionlint" -shellcheck=

  unit:
    name: "pytest and the toy runs of tools/ on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, specs: "python=3.12 git=2.43"}      # the floors conda/recipe.yaml declares
          - {os: macos-15, specs: "python git"}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: unit
      - name: "The test environment: conda-forge's python and git, which the tool package depends on"
        env:
          SPECS: ${{ matrix.specs }}
        run: |
          set -euo pipefail
          read -r -a specs <<< "$SPECS"
          conda install -q -y -c conda-forge "${specs[@]}" pytest zstandard
          python --version; git --version
      - name: "pytest"
        run: python -m pytest -q
      - name: "tools/tests/run-all.sh"
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/t"
          TMPDIR="$RUNNER_TEMP/t" bash tools/tests/run-all.sh
      - name: "Keep the toy runs"
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: run-all
          path: ${{ runner.temp }}/t
          retention-days: 14

  toy-channel:
    name: "The toy channel of two release lines (tools/tests/toy-channel.sh)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      top: ${{ steps.summary.outputs.top }}
      component: ${{ steps.summary.outputs.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tools      # rattler-build as $RATTLER_BUILD, and zstandard
      - name: "Build the toy channels of Isabelle2025-2 and Isabelle2026; check-packages on each line's batch"
        run: |
          set -euo pipefail
          bash tools/tests/toy-channel.sh "$RUNNER_TEMP/toy"
          bash tools/tests/toy-channel.sh "$RUNNER_TEMP/toy-2026" Isabelle2026
      - name: "The chain top and the component, as the release's build job reads them (the same on both lines)"
        id: summary
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/toy/summary.json"
          diff "$RUNNER_TEMP/toy/summary.json" "$RUNNER_TEMP/toy-2026/summary.json"      # accept-2026 reads them too
          echo "top=$(jq -r .top "$RUNNER_TEMP/toy/summary.json")" >> "$GITHUB_OUTPUT"
          echo "component=$(jq -r '.components[0] // ""' "$RUNNER_TEMP/toy/summary.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: toy-channel
          # only the main channels (local-channel copies every .conda it finds): both lines in one channel,
          # as the online one serves them after the first Isabelle2026 publish; the tool once, both lines
          # build it under one file name
          path: |
            ${{ runner.temp }}/toy/channel/noarch/*.conda
            ${{ runner.temp }}/toy-2026/channel/noarch/*.conda
            !${{ runner.temp }}/toy-2026/channel/noarch/isabelle-patch-control-*.conda
          if-no-files-found: error
          retention-days: 14

  hooks:
    name: "The hook layer with real conda (tools/tests/test_conda_hooks.sh)"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tools
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
          activate-environment: ""
      - name: "conda's versions"
        run: conda list -n base '^(conda|conda-libmamba-solver|libmambapy)$'
      - name: "test_conda_hooks.sh (it builds its toy channels with toy-channel.sh)"
        run: bash tools/tests/test_conda_hooks.sh "$RUNNER_TEMP/hooks"
      - name: "Keep conda's output of every command"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hooks-output
          path: ${{ runner.temp }}/hooks/out
          if-no-files-found: ignore
          retention-days: 14

  accept:
    needs: toy-channel
    uses: ./.github/workflows/accept.yml
    with:
      artifact: toy-channel
      isabelle_version: "2025.2"
      isabelle_build: "2"
      old_build: "1"
      non_pristine_build: "0"
      top: ${{ needs.toy-channel.outputs.top }}
      component: ${{ needs.toy-channel.outputs.component }}
      other_component: toy-component
      strict: true

  # the first pristine build of a new line: (e), (h) and (i) are skipped by their empty inputs, nothing else may skip
  accept-2026:
    needs: toy-channel
    uses: ./.github/workflows/accept.yml
    with:
      artifact: toy-channel
      isabelle_version: "2026"
      isabelle_build: "0"
      old_build: ""
      non_pristine_build: ""
      top: ${{ needs.toy-channel.outputs.top }}
      component: ${{ needs.toy-channel.outputs.component }}
      other_component: toy-component
      strict: true
