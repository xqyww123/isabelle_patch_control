# The batch release of the tool package and the feature packages to https://conda.qiyuan.me
# (patch tool plan decision 11; RELEASE.md "The batch release workflow" is the user's description).
#
# One build makes every package of the batch, the bytes accepted are the bytes published: `build`
# plans with tools/release-plan (reuse what the channel already serves and is exactly what the batch
# wants, build the rest with the next number), renders and builds the rest, looks inside every
# package and uploads ONE artifact, feature-packages, with noarch/*.conda only.  `roundtrip` runs
# tools/check-roundtrip against the installed packages and tool; `accept` runs tools/accept (§6) on
# five legs; `publish` calls publish-conda.yml once for the whole batch; `smoke` installs from the
# channel what the README tells users to install.
#
# Secrets (set on this repository, never `secrets: inherit`): CONDA_R2_ACCESS_KEY_ID and
# CONDA_R2_SECRET_ACCESS_KEY (publish-conda.yml); ISABELLE_PATCHED_READ_TOKEN, Contents: read on
# xqyww123/isabelle-patched (private) and on any private feature repository;
# PACKAGING_CI_ACTIONS_READ_TOKEN, Actions: read on xqyww123/isabelle-packaging-ci (rehearsals only).
name: release-features

on:
  workflow_dispatch:
    inputs:
      isabelle_build:
        description: "The build string of the pristine isabelle build every feature package pins"
        required: true
        type: string
      isabelle_from:
        description: "channel, or run:<isabelle-packaging-ci run id> to rehearse against that run's conda-packages artifact"
        required: true
        default: channel
        type: string
      tool_ref:
        description: "The tag of this repository the tool is built from (empty: the triggering ref)"
        default: ""
        type: string
      features:
        description: "Every feature release tag of the chain, bottom first, space-separated (lower features included)"
        required: true
        type: string
      session_build_legs:
        description: "Legs besides linux-64 that also build the component session (linux-aarch64 osx-arm64 osx-64 win-64)"
        default: ""
        type: string
      publish:
        description: "Publish to conda.qiyuan.me when roundtrip and every accept leg are green"
        type: boolean
        default: false

# Two batches never overlap: the second would plan against a channel the first is changing.
concurrency:
  group: release-features
  cancel-in-progress: false

env:
  CHANNEL: https://conda.qiyuan.me
  RATTLER_BUILD_URL: https://github.com/prefix-dev/rattler-build/releases/download/v0.69.1/rattler-build-x86_64-unknown-linux-musl
  # an Isabelle_RPC-style component package on the channel, for §6 (c) and (e)
  OTHER_COMPONENT: isabelle-performant-ml

jobs:
  build:
    name: "Plan, build and check the batch"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      isabelle_old_build: ${{ steps.plan.outputs.isabelle_old_build }}
      run_id: ${{ steps.inputs.outputs.run_id }}
      top: ${{ steps.check.outputs.top }}
      component: ${{ steps.check.outputs.component }}
      top_feature: ${{ steps.check.outputs.top_feature }}
    steps:
      # The first step: a rehearsal that publishes would publish packages accepted against a CI
      # artifact, not against the channel's isabelle.  An `if:` on the publish job alone would skip
      # the publish silently instead.
      - name: "Check the inputs"
        id: inputs
        env:
          FROM: ${{ inputs.isabelle_from }}
          PUBLISH: ${{ inputs.publish }}
          B: ${{ inputs.isabelle_build }}
        run: |
          set -euo pipefail
          case "$FROM" in
            channel) run_id= ;;
            run:[0-9]*) run_id=${FROM#run:} ;;
            *) echo "::error::isabelle_from is '$FROM': channel or run:<run id>"; exit 1 ;;
          esac
          if [ "$PUBLISH" = true ] && [ -n "$run_id" ]; then
            echo "::error::publish=true with isabelle_from=$FROM: a rehearsal against a CI artifact never publishes"; exit 1
          fi
          [[ "$B" =~ ^[A-Za-z0-9_]+$ ]] || { echo "::error::isabelle_build '$B' is not a build string"; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tool_ref || github.ref }}
          path: tool

      - name: "Install rattler-build and zstandard"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/rattler-build "$RATTLER_BUILD_URL"
          chmod +x /tmp/rattler-build
          /tmp/rattler-build --version
          python3 -m pip install --quiet zstandard

      - name: "The tool's version and build string prefix"
        id: tool
        run: |
          set -euo pipefail
          v=$(python3 -c "import tomllib; print(tomllib.load(open('tool/pyproject.toml', 'rb'))['project']['version'])")
          prefix=$(TOOL_VERSION=$v TOOL_BUILD_NUMBER=0 /tmp/rattler-build build --recipe tool/conda/recipe.yaml --render-only 2>/dev/null \
            | python3 -c "import json, sys; print(json.load(sys.stdin)[0]['recipe']['build']['string'].rsplit('_', 1)[0])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "isabelle-patch-control $v, build string ${prefix}_<n>"

      - name: "Plan: reuse or build every package (tools/release-plan)"
        id: plan
        env:
          B: ${{ inputs.isabelle_build }}
          FEATURES: ${{ inputs.features }}
        run: |
          set -euo pipefail
          read -r -a tags <<< "$FEATURES"
          python3 tool/tools/release-plan --channel "$CHANNEL" --isabelle-build "$B" \
            --tool-version "${{ steps.tool.outputs.version }}" --tool-prefix "${{ steps.tool.outputs.prefix }}" \
            "${tags[@]}" > plan.json
          cat plan.json
          echo "isabelle_old_build=$(jq -r .isabelle_old_build plan.json)" >> "$GITHUB_OUTPUT"

      - name: "Download the packages the channel already serves (byte for byte)"
        run: |
          set -euo pipefail
          mkdir -p out/noarch
          for f in $(jq -r '.packages[] | select(.action == "reuse") | .file' plan.json); do
            curl -fsSL "$CHANNEL/noarch/$f" -o "out/noarch/$f"
            echo "  reused  $f"
          done

      - name: "Build the tool package (when the plan says so)"
        run: |
          set -euo pipefail
          file=$(jq -r '.packages[] | select(.name == "isabelle-patch-control" and .action == "build") | .file' plan.json)
          [ -n "$file" ] || { echo "the tool is reused"; exit 0; }
          n=${file##*_}; n=${n%.conda}
          TOOL_VERSION="${{ steps.tool.outputs.version }}" TOOL_BUILD_NUMBER="$n" \
            /tmp/rattler-build build --recipe tool/conda/recipe.yaml --output-dir out -c conda-forge
          [ -f "out/noarch/$file" ] || { echo "::error::the tool package is not the planned out/noarch/$file"; ls out/noarch; exit 1; }

      # The fixed table feature -> (GitHub repository, package directory in it).  local_type_abbrev,
      # localized_record and local_datatype get their rows when their repositories exist.
      - name: "Check out, render and build the feature packages to build"
        env:
          B: ${{ inputs.isabelle_build }}
          TOKEN: ${{ secrets.ISABELLE_PATCHED_READ_TOKEN }}
        run: |
          set -euo pipefail
          declare -A REPO=(
            [expose_foreign]="xqyww123/isabelle-base-features expose_foreign"
            [future_assign_interrupt]="xqyww123/isabelle-base-features future_assign_interrupt"
            [light_locale]="xqyww123/Light_Locale ."
            [dev_patches]="xqyww123/qiyuan_dev_patches ."
          )
          jq -r '.packages[] | select(.tag and .action == "build") | "\(.tag) \(.file)"' plan.json | while read -r tag file; do
            feature=$(cut -d/ -f2 <<< "$tag")
            [ -n "${REPO[$feature]-}" ] || { echo "::error::no repository for $feature in the table"; exit 1; }
            read -r repo dir <<< "${REPO[$feature]}"
            url="https://github.com/$repo.git"
            [ -z "$TOKEN" ] || url="https://x-access-token:$TOKEN@github.com/$repo.git"
            git -c advice.detachedHead=false clone -q --depth 1 --branch "$tag" "$url" "src/$feature"
            n=${file##*_}; n=${n%.conda}
            python3 tool/tools/render-feature-recipe "src/$feature/$dir" --isabelle-build "$B" --build-number "$n" -o "recipes/$feature"
            /tmp/rattler-build build --recipe "recipes/$feature/recipe.yaml" --output-dir out --no-test
            [ -f "out/noarch/$file" ] || { echo "::error::$tag did not build the planned out/noarch/$file"; ls out/noarch; exit 1; }
          done

      - name: "Look inside every package; the batch is the whole chain (tools/check-packages)"
        id: check
        env:
          FEATURES: ${{ inputs.features }}
        run: |
          set -euo pipefail
          read -r -a tags <<< "$FEATURES"
          stray=$(find out -name '*.conda' -not -path 'out/noarch/*')
          [ -z "$stray" ] || { echo "::error::packages outside noarch/: $stray"; exit 1; }
          diff <(jq -r '.packages[].file' plan.json | sort) <(cd out/noarch && ls *.conda | sort) \
            || { echo "::error::out/noarch/ is not exactly the planned files"; exit 1; }
          python3 tool/tools/check-packages --chain "${tags[@]}" --summary summary.json out/noarch/*.conda
          cat summary.json
          top=$(jq -r .top summary.json)
          echo "top=$top" >> "$GITHUB_OUTPUT"
          echo "top_feature=$(cut -d/ -f2 <<< "${tags[-1]}")" >> "$GITHUB_OUTPUT"
          echo "component=$(jq -r '.components[0] // ""' summary.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: feature-packages
          # **: the path after it is kept, so the artifact is laid out as noarch/*.conda
          path: out/**/*.conda
          if-no-files-found: error
          retention-days: 30

  roundtrip:
    name: "Round trip of the installed chain (tools/check-roundtrip)"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tool_ref || github.ref }}
          path: tool
      - uses: actions/download-artifact@v4
        with:
          name: feature-packages
          path: ${{ runner.temp }}/pkgs
      - name: "The rehearsal's isabelle package"
        if: needs.build.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: conda-packages
          path: ${{ runner.temp }}/pkgs-ci
          repository: xqyww123/isabelle-packaging-ci
          run-id: ${{ needs.build.outputs.run_id }}
          github-token: ${{ secrets.PACKAGING_CI_ACTIONS_READ_TOKEN }}
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest      # conda-forge only: no defaults channel, no Terms of Service prompt
          auto-activate-base: true
          activate-environment: ""
      - name: "Index the local channel"
        env:
          B: ${{ inputs.isabelle_build }}
        run: bash tool/tools/local-channel "$RUNNER_TEMP/local" "$B" "$RUNNER_TEMP/pkgs" "$RUNNER_TEMP/pkgs-ci"
      - name: "Install isabelle and the tool, copy the tree, install the chain top"
        env:
          B: ${{ inputs.isabelle_build }}
          TOP: ${{ needs.build.outputs.top }}
        run: |
          set -euo pipefail
          ch=(--override-channels -c "file://$RUNNER_TEMP/local" -c "$CHANNEL" -c conda-forge)
          conda create -q -y -p "$RUNNER_TEMP/env" "${ch[@]}" "isabelle=2025.2=$B" isabelle-patch-control
          cp -a "$RUNNER_TEMP/env/isa" "$RUNNER_TEMP/pristine"
          conda install -q -y -p "$RUNNER_TEMP/env" "${ch[@]}" "$TOP"
      - name: "Fetch the two tags from isabelle-patched"
        env:
          TOKEN: ${{ secrets.ISABELLE_PATCHED_READ_TOKEN }}
          TOP_FEATURE: ${{ needs.build.outputs.top_feature }}
        run: |
          set -euo pipefail
          env=$RUNNER_TEMP/env
          bottom="$(cat "$env/isa/etc/ISABELLE_IDENTIFIER")/pristine/$(tr -d '[:space:]' < "$env/isa/etc/ISABELLE_ID")"
          top=$(sed -n 's/^release_tag: //p' "$env/share/isabelle_patch_control/features.d/$TOP_FEATURE/provenance.txt")
          git init -q "$RUNNER_TEMP/patched"
          git -C "$RUNNER_TEMP/patched" fetch -q --depth 1 "https://x-access-token:$TOKEN@github.com/xqyww123/isabelle-patched.git" \
            "refs/tags/$bottom:refs/tags/$bottom" "refs/tags/$top:refs/tags/$top"
          echo "fetched $bottom and $top"
      - name: "check-roundtrip with the installed tool and features.d"
        env:
          TOP_FEATURE: ${{ needs.build.outputs.top_feature }}
        run: |
          set -euo pipefail
          env=$RUNNER_TEMP/env
          python3 tool/tools/check-roundtrip "$RUNNER_TEMP/pristine" "$TOP_FEATURE" \
            --features-dir "$env/share/isabelle_patch_control/features.d" --tool "$env/bin/isabelle-patch-control" \
            -C "$RUNNER_TEMP/patched"

  accept:
    name: "Accept (§6) on ${{ matrix.leg }}"
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - {leg: linux-64, os: ubuntu-latest}
          - {leg: linux-aarch64, os: ubuntu-24.04-arm}
          - {leg: osx-arm64, os: macos-14}
          - {leg: osx-64, os: macos-14, subdir: osx-64}      # under Rosetta
          - {leg: win-64, os: windows-latest}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tool_ref || github.ref }}
          path: tool
      - uses: actions/download-artifact@v4
        with:
          name: feature-packages
          path: ${{ runner.temp }}/pkgs
      - name: "The rehearsal's isabelle package"
        if: needs.build.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: conda-packages
          path: ${{ runner.temp }}/pkgs-ci
          repository: xqyww123/isabelle-packaging-ci
          run-id: ${{ needs.build.outputs.run_id }}
          github-token: ${{ secrets.PACKAGING_CI_ACTIONS_READ_TOKEN }}
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest      # conda-forge only: no defaults channel, no Terms of Service prompt
          auto-activate-base: true
          activate-environment: ""
      - name: "Index the local channel"
        env:
          B: ${{ inputs.isabelle_build }}
        run: bash tool/tools/local-channel "$RUNNER_TEMP/local" "$B" "$RUNNER_TEMP/pkgs" "$RUNNER_TEMP/pkgs-ci"
      - name: "The component session (linux-64 and session_build_legs)"
        if: needs.build.outputs.component == 'isabelle-light-locale' && (matrix.leg == 'linux-64' || contains(inputs.session_build_legs, matrix.leg))
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/session"; mkdir -p "$d"
          printf '%s\n' 'session Accept_Light_Locale = Light_Locale +' '  theories Accept_Light_Locale' > "$d/ROOT"
          printf '%s\n' 'theory Accept_Light_Locale' '  imports Light_Locale.Light_Locale' 'begin' \
            'light_locale Accept = fixes S :: "nat set" assumes "finite S"' 'end' > "$d/Accept_Light_Locale.thy"
          echo "SESSION_DIR=$d" >> "$GITHUB_ENV"
      - name: "tools/accept"
        env:
          B: ${{ inputs.isabelle_build }}
          TOP: ${{ needs.build.outputs.top }}
          COMPONENT: ${{ needs.build.outputs.component }}
          OLD: ${{ needs.build.outputs.isabelle_old_build }}
        run: |
          set -euo pipefail
          local_url=$(python -c "import pathlib, sys; print(pathlib.Path(sys.argv[1]).resolve().as_uri())" "$RUNNER_TEMP/local")
          args=(--isabelle-build "$B" --top "$TOP" --other-component "$OTHER_COMPONENT" --old-build "$OLD"
                --channel "$local_url" --channel "$CHANNEL" --channel conda-forge
                --start-channel "$CHANNEL" --start-channel conda-forge --work "$RUNNER_TEMP/accept")
          [ -z "$COMPONENT" ] || args+=(--component "$COMPONENT")
          [ -z "${SESSION_DIR-}" ] || args+=(--session-dir "$SESSION_DIR")
          # osx-64 under Rosetta: only the test environments, not the base environment's own packages
          [ -z "${{ matrix.subdir }}" ] || export CONDA_SUBDIR="${{ matrix.subdir }}"
          python -u tool/tools/accept "${args[@]}"

  publish:
    needs: [build, roundtrip, accept]
    if: inputs.publish
    uses: xqyww123/isabelle-packaging-ci/.github/workflows/publish-conda.yml@main
    with:
      artifact: feature-packages
      package_name: ${{ needs.build.outputs.top }}
    secrets:
      CONDA_R2_ACCESS_KEY_ID: ${{ secrets.CONDA_R2_ACCESS_KEY_ID }}
      CONDA_R2_SECRET_ACCESS_KEY: ${{ secrets.CONDA_R2_SECRET_ACCESS_KEY }}

  # After publishing, it can only report.  The first command is the README's install line, read
  # from the common text the renderer copies into every feature package (the key: the line that
  # starts with `conda create -n `; tests/test_docs.py uses the same key), so the documented
  # command and the tested one cannot drift apart.
  smoke:
    name: "Smoke on ${{ matrix.os }}: the README's install command"
    needs: [build, publish]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash -l {0}
    env:
      CONDA_ALWAYS_YES: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tool_ref || github.ref }}
          path: tool
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest      # conda-forge only: no defaults channel, no Terms of Service prompt
          auto-activate-base: true
          activate-environment: ""
      - name: "The README's install command, as written"
        run: |
          set -euo pipefail
          cmd=$(grep -m1 '^conda create -n ' tool/common-readme.md)
          echo "$cmd"
          eval "$cmd" 2>&1 | tr -d '\r' | tee "$RUNNER_TEMP/create.txt"
          [ "$(grep -o -F 'The heaps shipped with the isabelle package' "$RUNNER_TEMP/create.txt" | wc -l)" = 1 ] \
            || { echo "::error::not exactly one heap paragraph"; exit 1; }
      - name: "Not the README's command: qiyuan-dev-patches, to cover the whole chain"
        if: contains(inputs.features, '/dev_patches/')
        run: conda install -n isabelle -c "$CHANNEL" -c conda-forge qiyuan-dev-patches
      - name: "status: every feature applied"
        run: |
          set -euo pipefail
          conda activate isabelle
          isabelle-patch-control status | tee "$RUNNER_TEMP/status.txt"
          ! grep -v '^tree ' "$RUNNER_TEMP/status.txt" | grep -v '^applied ' | grep -q . \
            || { echo "::error::a feature is not applied"; exit 1; }
